name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do NOT cancel an in-flight Pages deploy: cancelling can
# leave the deployment stuck/aborted for that commit and make retries fail.
# (Matches GitHub's official Pages workflow.)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps webkit chromium
      # Chromium and WebKit (the iPhone's engine), both blocking.
      - run: npm run test:e2e
      # Sync against the real PHP receiver, current and original versions.
      - run: php -l nas/systema-backup.php
      - name: NAS receiver e2e (real PHP)
        run: |
          mkdir -p "$RUNNER_TEMP/nas"
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/nas" > "$RUNNER_TEMP/php.log" 2>&1 &
          SYSTEMA_PHP_URL=http://127.0.0.1:8099 SYSTEMA_PHP_ROOT="$RUNNER_TEMP/nas" \
            npx playwright test tests/e2e/php-receiver.spec.ts
      # Two real builds with the service worker on: no reload mid-entry.
      - run: npm run test:pwa

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
